source: >-
  Direct HTTPS probes of the named /.well-known/ path list on every host this
  record knows, 2026-09-05.
description: >-
  Campbell's serves no /.well-known/ discovery document on any host. Every path
  probed returned 404. On www.campbells.com and www.thecampbellscompany.com the
  WordPress 404 template answers with a ~97KB / ~68KB HTML page rather than a
  document, and on api.campbells.com the Apigee router answers with its JSON
  routing fault. A recorded absence is valid data — no WellKnown or SecurityTxt
  pointer is emitted for this repo, because nothing was served.
