notes: |
  All 404 bodies were read, not just their status codes. The WordPress hosts
  return the site 404 template (text/html, `<title>Page not found</title>`), and
  api.campbells.com returns
  {"fault":{"faultstring":"Unable to identify proxy for host: ... and url: ..."}}.
  Neither is a document, so neither earns a pointer.

  developer.campbellskitchen.com could not be probed at all: the hostname has no
  DNS A record.
