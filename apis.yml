description: >-
  Campbell's (Campbell Soup Company, now The Campbell's Company) is the
  consumer brand trusted for generations to provide authentic, flavourful,
  and readily available soups, meals, and recipes. Alongside its consumer
  website, Campbell's has historically operated a Campbell's Kitchen
  Developer API that let developers embed Campbell's, Swanson, Pace, Prego,
  and Pepperidge Farm recipes, products, and nutrition data into their own
  web and mobile experiences.
apis:
  - aid: campbells:campbells-kitchen-api
    name: Campbell's Kitchen API
    description: >-
      The Campbell's Kitchen API exposes recipe and product data from
      Campbell's consumer brands — including Campbell's, Swanson, Pace,
      Prego, and Pepperidge Farm — for use in search-based recipe and
      product applications. The API returns recipes, ingredients, product
      details, UPC lookups, photography, ratings, and updated Nutrition
      Facts panel data.
